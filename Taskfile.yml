version: "3"
# https://taskfile.dev

tasks:
  default:
    - uv run python -m tg

  release:
    - uv run sh check.sh
    - |
      CURRENT_VERSION=$(cat tg/__init__.py | grep version | cut -d '"' -f 2)
      echo Current version $CURRENT_VERSION

      NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1 "." $2+1 ".0"}')
      echo New version $NEW_VERSION
      sed -i '' "s|$CURRENT_VERSION|$NEW_VERSION|g" tg/__init__.py
      uv version $NEW_VERSION

      git add -u tg/__init__.py pyproject.toml uv.lock
      git commit -m "Release v$NEW_VERSION"
      git tag v$NEW_VERSION

      uv build --clear
      UV_PUBLISH_TOKEN=$(pass show i/pypi-tg-token | head -n 1) uv publish
      git push origin master --tags
      gh release create v$NEW_VERSION --generate-notes --title v$NEW_VERSION --verify-tag

  ch:
    - uv run ruff check --fix
    - uv run ruff format .
    - uv run mypy tg tests
