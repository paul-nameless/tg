[project]
name = "tg"
version = "0.26.0"
description = "Terminal Telegram client"
authors = [{ name = "Paul Nameless", email = "reacsdas@gmail.com" }]
license = "Unlicense"
license-files = ["UNLICENSE"]
readme = "readme.md"
urls = { Homepage = "https://github.com/paul-nameless/tg", Repository = "https://github.com/paul-nameless/tg" }
requires-python = ">=3.10,<4.0.0"
dependencies = ["python-telegram (==2.0.0)", "standard-mailcap (>=3.13.0)", "qrcode (>=8.0)"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
rtl = ["arabic-reshaper (>=3.0.0)", "python-bidi (>=0.6.0)"]

[dependency-groups]
dev = ["mypy>=2.4.1,<3", "ruff>=0.17.5,<0.18"]

[project.scripts]
tg = "tg.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tg"
module-root = ""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
